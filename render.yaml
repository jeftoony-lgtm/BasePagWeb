# =====================================================================
#  LUZ SERENA · Publicación en Render (plan gratis)
#  Un solo servicio: Express sirve la API (/api) y la página compilada.
#  Render pide MONGODB_URI al crearlo; JWT_SECRET lo genera solo.
# =====================================================================

services:
  - type: web
    name: luzserena-residencial
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true

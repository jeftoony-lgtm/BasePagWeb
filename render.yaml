# =====================================================================
#  KIVO · Publicación en Render (plan gratis)
#  Un solo servicio: Express sirve la API (/api) y la página compilada.
#  Render pide MONGODB_URI y ANTHROPIC_API_KEY al crearlo; JWT_SECRET lo genera solo.
# =====================================================================

services:
  - type: web
    name: kivo-minimarket
    runtime: node
    plan: free
    rootDir: kivo-minimarket
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
